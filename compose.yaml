services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: microsonya/telegram-bot:local
    restart: unless-stopped
    # All configuration (storage, models, router) is read from .env by the
    # app itself (packages/model-gateway/src/config.ts is the single source
    # of defaults) — copy .env.docker.example to .env rather than overriding
    # values here, so there's one place to look, not two.
    env_file:
      - path: .env
        required: false
