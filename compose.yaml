services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: microsonya/telegram-bot:local
    restart: unless-stopped
    # All configuration (storage, models, router) is read from .env by the
    # app itself (packages/model-gateway/src/config.ts is the single source
    # of defaults) — copy .env.docker.example to .env rather than overriding
    # values here, so there's one place to look, not two.
    env_file:
      - path: .env
        required: false

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-microsonya}
      POSTGRES_USER: ${POSTGRES_USER:-microsonya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-microsonya}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-microsonya} -d $${POSTGRES_DB:-microsonya}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
